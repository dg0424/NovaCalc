
      - name: Extract Android project
        run: |
          ZIP_FILE=$(find . -type f -name 'NovaCalcAndroid_Project-1.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP file not found"
            find . -maxdepth 4 -type f
            exit 1
          fi
          echo "Found ZIP: $ZIP_FILE"
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          find extracted -type f -name gradlew
          find extracted -type f -name settings.gradle -o -name settings.gradle.kts
          
