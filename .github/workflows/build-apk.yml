

name: Build Calculation APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check project folder
        run: ls -la Calculation-Android-Redesign

      - name: Build APK
        working-directory: Calculation-Android-Redesign
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Calculation-debug-apk
          path: Calculation-Android-Redesign/app/build/outputs/apk/debug/app-debug.apk
