
name: Build NovaCalc APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project ZIP
        run: |
          unzip -q Calculation_App_Project.zip -d extracted

      - name: Build APK
        working-directory: extracted/NovaCalcAndroid
        run: gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaCalc-APK
          path: extracted/NovaCalcAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
